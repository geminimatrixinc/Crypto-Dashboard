name: ESLint Fix Skill

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      failed-jobs:
        required: true
        type: string

jobs:
  eslint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr-number }}/head
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Determine project paths
        id: paths
        run: |
          if echo "${{ inputs.failed-jobs }}" | grep -q "lint-back-end"; then
            PROJECT_PATH=fs-crypto-coin-tracker/stage-2-node-express-mongo/back-end
            PROJECT_TYPE=back-end
          elif echo "${{ inputs.failed-jobs }}" | grep -q "lint-front-end"; then
            PROJECT_PATH=fs-crypto-coin-tracker/stage-2-node-express-mongo/front-end-ui
            PROJECT_TYPE=front-end
          fi

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No matching lint job found in failed-jobs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_OUTPUT
          echo "PROJECT_TYPE=$PROJECT_TYPE" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install
        working-directory: ${{ steps.paths.outputs.PROJECT_PATH }}

      - name: Run ESLint with auto-fix
        id: eslint-fix
        continue-on-error: true
        run: npx eslint . --fix
        working-directory: ${{ steps.paths.outputs.PROJECT_PATH }}

      - name: Check if fixes were applied
        id: check-fixes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "fixes-applied=true" >> $GITHUB_OUTPUT
            git diff --stat
          else
            echo "fixes-applied=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update fix branch
        if: steps.check-fixes.outputs.fixes-applied == 'true'
        env:
          FIX_BRANCH: fix-for-dependabot-${{ inputs.pr-number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preserve the eslint --fix changes before switching branches
          git add -A
          git stash push -u -m eslint-fixes || true

          # Stack on the existing fix branch if present, else branch off the PR head
          if git ls-remote --exit-code --heads origin "$FIX_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$FIX_BRANCH"
            git checkout -B "$FIX_BRANCH" "origin/$FIX_BRANCH"
          else
            git checkout -B "$FIX_BRANCH"
          fi

          # Reapply the fixes on top of the fix branch
          git stash pop || true

          git add -A
          git commit -m "fix: resolve ESLint violations from dependabot PR #${{ inputs.pr-number }}" || echo "No changes to commit"
          git push origin "$FIX_BRANCH" --force-with-lease

      - name: Report results
        run: |
          echo "### ESLint Fix Report" >> $GITHUB_STEP_SUMMARY
          echo "- Fixes applied: ${{ steps.check-fixes.outputs.fixes-applied }}" >> $GITHUB_STEP_SUMMARY
          echo "- Project: ${{ steps.paths.outputs.PROJECT_TYPE }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-fixes.outputs.fixes-applied }}" == "true" ]; then
            echo "- Branch: fix-for-dependabot-${{ inputs.pr-number }}" >> $GITHUB_STEP_SUMMARY
          fi
