name: Dependabot Auto-Fix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  check-dependabot:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      failed-jobs: ${{ steps.pr-info.outputs.failed_jobs }}
      pr-number: ${{ steps.pr-info.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract PR info and detect jobs
        id: pr-info
        env:
          WORKFLOW_RUN: ${{ toJson(github.event.workflow_run) }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Extract PR number from pull_requests array
          PR_NUMBER=$(echo "$WORKFLOW_RUN" | jq -r '.pull_requests[0].number // empty')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this workflow run"
            echo "failed_jobs=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if PR is from dependabot
          AUTHOR=$(gh pr view $PR_NUMBER --json author -q '.author.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "PR is not from dependabot"
            echo "failed_jobs=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Detect failed jobs
          JOBS=$(gh run view $WORKFLOW_RUN_ID --json jobs -q '.jobs[] | select(.conclusion=="FAILURE") | .name')

          FAILED_JOBS=""
          for job in $JOBS; do
            if [[ "$job" == lint-* ]]; then
              FAILED_JOBS="$FAILED_JOBS eslint-fix:$job"
            elif [[ "$job" == test-* ]]; then
              FAILED_JOBS="$FAILED_JOBS test-fix:$job"
            elif [[ "$job" == build-* ]]; then
              FAILED_JOBS="$FAILED_JOBS build-fix:$job"
            fi
          done

          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT

  fix-eslint:
    needs: check-dependabot
    if: contains(needs.check-dependabot.outputs.failed-jobs, 'eslint-fix')
    uses: ./.github/workflows/eslint-fix.yml
    with:
      pr-number: ${{ needs.check-dependabot.outputs.pr-number }}
      failed-jobs: ${{ needs.check-dependabot.outputs.failed-jobs }}

  fix-tests:
    needs: check-dependabot
    if: contains(needs.check-dependabot.outputs.failed-jobs, 'test-fix')
    uses: ./.github/workflows/test-fix.yml
    with:
      pr-number: ${{ needs.check-dependabot.outputs.pr-number }}
      failed-jobs: ${{ needs.check-dependabot.outputs.failed-jobs }}

  create-fix-pr:
    needs: check-dependabot
    if: always() && needs.check-dependabot.outputs.pr-number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for fix changes
        id: check-changes
        env:
          FIX_BRANCH: fix-for-dependabot-${{ needs.check-dependabot.outputs.pr-number }}
        run: |
          git fetch origin $FIX_BRANCH 2>/dev/null && echo "branch-exists=true" >> $GITHUB_OUTPUT || echo "branch-exists=false" >> $GITHUB_OUTPUT

      - name: Determine fix types
        id: fix-types
        env:
          FAILED_JOBS: ${{ needs.check-dependabot.outputs.failed-jobs }}
        run: |
          FIX_TYPES=""
          if echo "$FAILED_JOBS" | grep -q "eslint-fix"; then
            FIX_TYPES="$FIX_TYPES ESLint"
          fi
          if echo "$FAILED_JOBS" | grep -q "test-fix"; then
            FIX_TYPES="$FIX_TYPES Tests"
          fi
          if echo "$FAILED_JOBS" | grep -q "build-fix"; then
            FIX_TYPES="$FIX_TYPES Build"
          fi

          # Clean up and join with " & "
          FIX_TYPES=$(echo $FIX_TYPES | xargs | sed 's/ / \& /g')
          echo "fix_types=$FIX_TYPES" >> $GITHUB_OUTPUT

      - name: Create or update fix PR
        if: steps.check-changes.outputs.branch-exists == 'true'
        id: create-pr
        env:
          PR_NUMBER: ${{ needs.check-dependabot.outputs.pr-number }}
          FIX_BRANCH: fix-for-dependabot-${{ needs.check-dependabot.outputs.pr-number }}
          FIX_TYPES: ${{ steps.fix-types.outputs.fix_types }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if fix PR already exists
          EXISTING_PR=$(gh pr list --head $FIX_BRANCH --state open --json number -q '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            # Build PR body (printf keeps YAML block scalar valid - no column-0 lines)
            BODY=$(printf '🔧 Automatically fixed CI failures from #%s\n\n## What was fixed\n- %s failures resolved\n\n## How to proceed\n1. Review this PR to ensure the fixes are correct\n2. This PR should be merged before or alongside #%s\n3. Once merged, the original dependabot PR can be reviewed and merged\n\n---\n*Generated by dependabot auto-fix workflow*' "$PR_NUMBER" "$FIX_TYPES" "$PR_NUMBER")

            gh pr create \
              --head $FIX_BRANCH \
              --base main \
              --title "[Auto-Fix] Fix $FIX_TYPES failures from dependabot #$PR_NUMBER" \
              --body "$BODY"

            NEW_PR=$(gh pr list --head $FIX_BRANCH --state open --json number -q '.[0].number')
            echo "pr_number=$NEW_PR" >> $GITHUB_OUTPUT
          else
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
          fi

      - name: Label fix PR
        if: steps.create-pr.outputs.pr_number
        env:
          FIX_PR: ${{ steps.create-pr.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit $FIX_PR --add-label "dependabot-auto-fix"

      - name: Comment on dependabot PR
        if: steps.create-pr.outputs.pr_number
        env:
          PR_NUMBER: ${{ needs.check-dependabot.outputs.pr-number }}
          FIX_PR: ${{ steps.create-pr.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf '🔧 **Auto-fix PR created:** #%s\n\nThis stacked PR contains automatic fixes for the CI failures in this PR. Please review and merge #%s first, then this PR can be merged.' "$FIX_PR" "$FIX_PR")
          gh pr comment $PR_NUMBER --body "$BODY"
